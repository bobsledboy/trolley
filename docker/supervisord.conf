[supervisord]
nodaemon=true

[program:postgres]
command=/bin/bash -c "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | head -1); exec su postgres -c \"$PG_BIN/postgres -D ${PGDATA}\""
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
command=python -m bot.main
directory=/app
priority=2
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
