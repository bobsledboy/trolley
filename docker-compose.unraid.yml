services:
  bot:
    image: ghcr.io/bobsledboy/trolley:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: trolley
      POSTGRES_USER: trolley
      POSTGRES_PASSWORD: trolley
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trolley"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - /mnt/user/appdata/trolley/pgdata:/var/lib/postgresql/data
